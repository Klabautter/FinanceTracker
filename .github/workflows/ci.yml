name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  XCODEGEN_VERSION: 2.46.0
  REQUIRED_XCODE_MAJOR: 27

jobs:
  macos:
    name: macOS build and unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The app needs Xcode 27 (macOS 26 SDK APIs). Hosted runners may lag
      # behind; then the job says so instead of failing on an old SDK.
      # Scripts/release.sh runs the same tests locally before every release.
      - name: Check Xcode version
        id: xcode
        run: |
          major="$(xcodebuild -version | awk 'NR==1 {split($2, v, "."); print v[1]}')"
          echo "Runner Xcode major version: $major"
          if [ "$major" -lt "$REQUIRED_XCODE_MAJOR" ]; then
            echo "::warning::Xcode $REQUIRED_XCODE_MAJOR is not available on this runner yet; build and tests skipped."
            echo "supported=false" >> "$GITHUB_OUTPUT"
          else
            echo "supported=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install XcodeGen (pinned)
        if: steps.xcode.outputs.supported == 'true'
        run: |
          curl -sL "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o xcodegen.zip
          unzip -q xcodegen.zip
          sudo mv xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          xcodegen version

      - name: Generate project
        if: steps.xcode.outputs.supported == 'true'
        run: xcodegen generate

      - name: Unit tests (macOS)
        if: steps.xcode.outputs.supported == 'true'
        run: |
          set -o pipefail
          xcodebuild test -project FinanceTracker.xcodeproj -scheme FinanceTracker \
            -destination 'platform=macOS' -skip-testing:FinanceTrackerUITests_macOS \
            CODE_SIGNING_ALLOWED=NO
